name: Feature idea
description: Something Holdnote should do, or do better.
title: "Idea: "
labels: [idea]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like Holdnote to do
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help you
  - type: markdown
    attributes:
      value: Holdnote never gives buy or sell advice or forecasts, so ideas in that direction can't be added.
