# Builds buffettbot.zip and attaches it to a GitHub release, either when a
# version tag is pushed (git tag v1.0.0 && git push origin v1.0.0) or from
# Actions -> Release -> Run workflow with a version. The README's "latest
# release" link is where new users get the skill.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "New version to release, e.g. v1.2.0 (must not exist yet)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      # A version that is already released fails here, in words, instead of
      # at the last step after the tests (Release #3, 2026-10-15).
      - name: Check the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not like v1.2.0"
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$VERSION is already released. Run the workflow again (not Re-run) with a new version."
            exit 1
          fi

      - name: Run the tests
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q

      - name: Build the skill zip
        run: python3 scripts/build_zip.py

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/buffettbot.zip \
            --target "$GITHUB_SHA" --title "BuffettBot $VERSION" --generate-notes
