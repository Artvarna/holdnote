# Runs the tests on every pull request and every push to main, so a problem
# shows on the PR instead of at release time. Two setups: pytest alone (what
# the release workflow installs) and with Pillow (PNG cards).

name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extras: ["", "pillow"]
    name: tests ${{ matrix.extras || 'plain' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -q pytest ${{ matrix.extras }}
      - name: Run the tests
        run: python -m pytest -q
